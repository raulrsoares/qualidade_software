name: CI

# on:
#   push:
#     branches: ["**"]
#   pull_request:
#     branches: ["**"]


on:
  push:
    branches:
      - "**"  # Dispara em qualquer commit feito em qualquer branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build
        run: ./mvnw package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  echo:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Only Echo
        run: echo "Isso acontece antes do meu teste"
    
  test:
    runs-on: ubuntu-latest
    needs:
      - build
      - echo

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Test
        run: ./mvnw test
